# The EchoPhase instance on the k3s node "dusty": what Flux deploys (apps/,
# clusters/) and the cluster's own infrastructure (infra/: registry, Woodpecker).
# `mise install` for the tools; `mise tasks` for what can be done here.
[tools]
helm = "4.3.0"
kubectl = "1.36.1"
flux2 = "2.9.5"
sops = "3.13.3"
age = "1.3.2"
oras = "1.3.4"
"github:woodpecker-ci/woodpecker" = { version = "3.18.1", matching_regex = "^woodpecker-cli_" }

# Each keeps a value already set in the environment. Per-machine values and
# secrets (Woodpecker host, OAuth app) go in mise.local.toml (gitignored).
[env]
# The in-cluster registry: localhost:30500 on the node, its Service from pods.
DOCKER_REGISTRY = "{{ get_env(name='DOCKER_REGISTRY', default='localhost:30500') }}"
REGISTRY_API = "{{ get_env(name='REGISTRY_API', default=get_env(name='DOCKER_REGISTRY', default='localhost:30500')) }}"
# Repositories in that registry that registry:prune looks after.
REGISTRY_REPOS = "{{ get_env(name='REGISTRY_REPOS', default='echophase/server echophase/webapp echophase/openapi') }}"
HELM_RELEASE = "{{ get_env(name='HELM_RELEASE', default='echophase') }}"
HELM_NAMESPACE = "{{ get_env(name='HELM_NAMESPACE', default='echophase') }}"
# kubectl's usual default; k3s's own kubectl would read the root-only
# /etc/rancher/k3s/k3s.yaml.
KUBECONFIG = "{{ get_env(name='KUBECONFIG', default=get_env(name='HOME', default='~') ~ '/.kube/config') }}"
WOODPECKER_ADMIN_USER = "{{ get_env(name='WOODPECKER_ADMIN_USER', default='CodeHeister') }}"
# GitHub owners whose repositories Woodpecker may build.
WOODPECKER_REPO_OWNERS = "{{ get_env(name='WOODPECKER_REPO_OWNERS', default='CodeHeister,EchoPhase-Project') }}"
