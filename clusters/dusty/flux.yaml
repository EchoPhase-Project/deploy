# Entry point for the k3s node "dusty". Applied once by `mise run flux:install`
# (EchoPhase repo); from then on Flux keeps this directory in sync itself.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: deploy
  namespace: flux-system
spec:
  interval: 1m
  # Public repository: read over HTTPS without credentials.
  url: https://github.com/EchoPhase-Project/deploy
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/dusty
  prune: true
  sourceRef:
    kind: GitRepository
    name: deploy
