apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: weblate
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/weblate
  prune: true
  wait: true
  timeout: 20m
  sourceRef:
    kind: GitRepository
    name: deploy
  # secrets.enc.yaml; the age key is Secret flux-system/sops-age.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
