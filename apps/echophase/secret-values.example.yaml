# Shape of secret-values.enc.yaml (the real one is SOPS-encrypted). To change
# a password: `sops apps/echophase/secret-values.enc.yaml`. Postgres keeps the
# password its volume was initialised with: change it there too (ALTER USER).
apiVersion: v1
kind: Secret
metadata:
  name: echophase-secret-values
  namespace: echophase
type: Opaque
stringData:
  values.yaml: |
    secrets:
      POSTGRES_PASSWORD: CHANGE_ME
      VALKEY_PASSWORD: CHANGE_ME
      SCYLLA_PASSWORD: ""
