# EchoPhase in the local k3s. CI (Woodpecker) changes only the image tags
# below (`mise run release:bump`, per component); the chart version is in
# chart.yaml. Flux upgrades the release when either changes.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: echophase
  namespace: echophase
spec:
  interval: 10m
  # The release Helm already manages (helm list -n echophase): Flux upgrades
  # it in place, keeping its history and rollbacks.
  releaseName: echophase
  chartRef:
    kind: OCIRepository
    name: echophase-chart
  upgrade:
    remediation:
      retries: 2
  # Passwords (secrets.*), SOPS-encrypted in secret-values.enc.yaml.
  valuesFrom:
    - kind: Secret
      name: echophase-secret-values
      valuesKey: values.yaml
  values:
    # Images come from the in-cluster registry, where Woodpecker pushes them
    # (the chart's defaults are the GHCR releases).
    imageRegistry: localhost:30500
    secrets:
      # Its password is in secret-values.enc.yaml; the chart's default user
      # is empty (Scylla without authentication).
      SCYLLA_USERNAME: echophase
    echophase:
      image:
        repository: echophase/server
        tag: "0.1.0-9-ga0c6d6c" # ci:image-tag server
    migrate:
      image:
        repository: echophase/server
        tag: "0.1.0-9-ga0c6d6c" # ci:image-tag server
    webapp:
      image:
        repository: echophase/webapp
        tag: "0.1.0-9-gfdf42a9" # ci:image-tag webapp
      service:
        # Traefik's LoadBalancer already holds ports 80/443 on the node.
        type: ClusterIP
      ingress:
        # k3s ships Traefik as the default ingress controller.
        className: traefik
        controller: traefik
