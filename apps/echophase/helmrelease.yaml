# EchoPhase in the local k3s. CI (Woodpecker) changes only the image tags
# below (`mise run release:bump`, per component); the chart version is in
# chart.yaml. Flux upgrades the release when either changes.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: echophase
  namespace: echophase
spec:
  interval: 10m
  # The release Helm already manages (helm list -n echophase): Flux upgrades
  # it in place, keeping its history and rollbacks.
  releaseName: echophase
  chartRef:
    kind: OCIRepository
    name: echophase-chart
  upgrade:
    remediation:
      retries: 2
  # Passwords (secrets.*), SOPS-encrypted in secret-values.enc.yaml.
  valuesFrom:
    - kind: Secret
      name: echophase-secret-values
      valuesKey: values.yaml
  values:
    # Images come from the in-cluster registry, where Woodpecker pushes them
    # (the chart's defaults are the GHCR releases).
    imageRegistry: localhost:30500
    secrets:
      # Its password is in secret-values.enc.yaml; the chart's default user
      # is empty (Scylla without authentication).
      SCYLLA_USERNAME: echophase
    echophase:
      image:
        repository: echophase/server
        tag: "0.5.0-10-g4c9841d" # ci:image-tag server
      # Traces to Tempo, metrics to VictoriaMetrics (apps/monitoring).
      extraEnv:
        OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
        OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo.monitoring:4318/v1/traces
        OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://victoria-metrics.monitoring:8428/opentelemetry/v1/metrics
        # Errors to GlitchTip, project "server" (mise run monitoring:glitchtip-bootstrap):
        # SENTRY_DSN is in secret-values.enc.yaml, merged into this map.
    migrate:
      image:
        repository: echophase/server
        tag: "0.5.0-10-g4c9841d" # ci:image-tag server
    webapp:
      # Browser errors to GlitchTip, project "webapp", through the webapp's
      # nginx (/errors), so GlitchTip stays in the tailnet. This DSN is public by
      # design (browsers get it from /config.json), unlike the server's.
      extraEnv:
        SENTRY_DSN: http://2d93507bf8e04411ae8c136c4e8edbf7@glitchtip.monitoring.svc/2
        ERRORS_UPSTREAM: glitchtip.monitoring.svc.cluster.local:80
        ERRORS_PROJECT: "2"
        # Visit statistics to Umami, website EchoPhase (mise run
        # monitoring:umami-bootstrap), also through the webapp's nginx (/stats/).
        UMAMI_UPSTREAM: umami.monitoring.svc.cluster.local:80
        UMAMI_WEBSITE_ID: 15b4cdc0-dce6-49dc-8444-6fe7dfafd7e4
      image:
        repository: echophase/webapp
        tag: "0.5.0-3-geec4f88" # ci:image-tag webapp
      service:
        # Traefik's LoadBalancer already holds ports 80/443 on the node.
        type: ClusterIP
      ingress:
        # k3s ships Traefik as the default ingress controller.
        className: traefik
        controller: traefik
