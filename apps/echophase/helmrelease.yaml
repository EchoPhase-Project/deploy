# EchoPhase in the local k3s. CI (Woodpecker) changes only the image tags
# below; Flux upgrades the release when this file or the chart changes.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: echophase
  namespace: echophase
spec:
  interval: 10m
  # The release Helm already manages (helm list -n echophase): Flux upgrades
  # it in place, keeping its history and rollbacks.
  releaseName: echophase
  chart:
    spec:
      chart: ./charts/echophase
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: deploy
        namespace: flux-system
  upgrade:
    remediation:
      retries: 2
  # Passwords (secrets.*), SOPS-encrypted in secret-values.enc.yaml.
  valuesFrom:
    - kind: Secret
      name: echophase-secret-values
      valuesKey: values.yaml
  values:
    imageRegistry: localhost:30500
    echophase:
      image:
        tag: "0.0.0-gcbcaefa" # ci:image-tag
    migrate:
      image:
        tag: "0.0.0-gcbcaefa" # ci:image-tag
    webapp:
      image:
        tag: "0.0.0-gcbcaefa" # ci:image-tag
      service:
        # Traefik's LoadBalancer already holds ports 80/443 on the node.
        type: ClusterIP
      ingress:
        # k3s ships Traefik as the default ingress controller.
        className: traefik
        controller: traefik
