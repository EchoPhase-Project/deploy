# Cache and Celery queue of Weblate (Redis protocol).
apiVersion: v1
kind: Service
metadata:
  name: weblate-valkey
spec:
  selector:
    app.kubernetes.io/name: weblate-valkey
  ports:
    - name: valkey
      port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: weblate-valkey
spec:
  serviceName: weblate-valkey
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: weblate-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weblate-valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8.1
          command: ["sh", "-c", 'exec valkey-server --requirepass "$VALKEY_PASSWORD" --appendonly yes']
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: weblate-secrets
                  key: VALKEY_PASSWORD
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
