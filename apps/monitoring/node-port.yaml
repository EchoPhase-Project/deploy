# Grafana on 127.0.0.1:30820, Gatus on :30830, GlitchTip on :30840 and Umami on
# :30850 of the node, for `tailscale serve` (mise run
# monitoring:expose), like Weblate's: nothing listens on other addresses.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-node-port
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-node-port
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-node-port
    spec:
      containers:
        - name: socat
          image: alpine/socat:1.8.1.1
          args:
            - TCP-LISTEN:3000,fork,reuseaddr
            - TCP:grafana.monitoring.svc:80
          ports:
            - containerPort: 3000
              hostPort: 30820
              hostIP: 127.0.0.1
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              memory: 64Mi
