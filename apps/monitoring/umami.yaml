# Umami: privacy-friendly visit statistics of the webapp (no cookies, Do Not
# Track respected), with its own Postgres. Browsers load the tracker from the
# webapp and send to it (its nginx forwards /stats/ here), so Umami needs no
# public address. Secrets in secrets.enc.yaml (umami-env); UI on the node's
# 127.0.0.1:30850 for `mise run monitoring:expose`.
apiVersion: v1
kind: Service
metadata:
  name: umami-postgres
spec:
  selector:
    app.kubernetes.io/name: umami-postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: umami-postgres
spec:
  serviceName: umami-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: umami-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: umami-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17.6
          env:
            - name: POSTGRES_USER
              value: umami
            - name: POSTGRES_DB
              value: umami
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: umami-env
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "umami", "-d", "umami"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umami
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: umami
  template:
    metadata:
      labels:
        app.kubernetes.io/name: umami
    spec:
      containers:
        - name: umami
          image: ghcr.io/umami-software/umami:3.4.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DISABLE_TELEMETRY
              value: "1"
            - name: DISABLE_UPDATES
              value: "1"
          envFrom:
            - secretRef:
                name: umami-env
          readinessProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 192Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: umami
spec:
  selector:
    app.kubernetes.io/name: umami
  ports:
    - name: http
      port: 80
      targetPort: http
