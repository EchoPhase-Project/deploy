# Cluster infrastructure of this instance: Woodpecker CI (infra/woodpecker)
# and its Tailscale exposure.

# Needs WOODPECKER_SERVER and the GitHub OAuth app in mise.local.toml (see
# mise.local.toml.example); the app's secret goes into a Kubernetes Secret only.
["woodpecker:install"]
description = "Deploy or update Woodpecker CI (infra/woodpecker)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
: "${WOODPECKER_SERVER:?set it in mise.local.toml (https://<node>.<tailnet>.ts.net)}"
: "${WOODPECKER_GITHUB_CLIENT:?set it in mise.local.toml (GitHub OAuth app)}"
: "${WOODPECKER_GITHUB_SECRET:?set it in mise.local.toml (GitHub OAuth app)}"
# GitHub calls the same host on the funnel port, which only serves /api/hook.
webhook_host() { echo "$WOODPECKER_SERVER" | sed -E 's#^(https://[^/:]+).*#\1:8443#'; }
kubectl apply -f infra/woodpecker/cluster.yaml
kubectl -n woodpecker create secret generic woodpecker-github \
    --from-env-file=<(printf 'WOODPECKER_GITHUB_CLIENT=%s\nWOODPECKER_GITHUB_SECRET=%s\n' \
        "$WOODPECKER_GITHUB_CLIENT" "$WOODPECKER_GITHUB_SECRET") \
    --dry-run=client -o yaml | kubectl apply -f -
# Signs the agents' gRPC sessions; kept across restarts (random once).
if ! kubectl -n woodpecker get secret woodpecker-grpc >/dev/null 2>&1; then
    kubectl -n woodpecker create secret generic woodpecker-grpc \
        --from-env-file=<(printf 'WOODPECKER_GRPC_SECRET=%s\n' "$(head -c 32 /dev/urandom | base64 | tr -d '/+=')")
fi
# Woodpecker's own Postgres; the password is random, made once.
if ! kubectl -n woodpecker get secret woodpecker-db >/dev/null 2>&1; then
    pw=$(head -c 32 /dev/urandom | base64 | tr -d '/+=')
    kubectl -n woodpecker create secret generic woodpecker-db \
        --from-env-file=<(printf 'POSTGRES_PASSWORD=%s\nWOODPECKER_DATABASE_DATASOURCE=postgres://woodpecker:%s@woodpecker-postgres:5432/woodpecker?sslmode=disable\n' "$pw" "$pw")
fi
kubectl apply -f infra/woodpecker/postgres.yaml
kubectl -n woodpecker rollout status statefulset/woodpecker-postgres --timeout=180s
helm upgrade --install woodpecker oci://ghcr.io/woodpecker-ci/helm/woodpecker --version 3.7.3 \
    --namespace woodpecker --values infra/woodpecker/values.yaml \
    --set-string "server.env.WOODPECKER_HOST=$WOODPECKER_SERVER" \
    --set-string "server.env.WOODPECKER_EXPERT_WEBHOOK_HOST=$(webhook_host)" \
    --set-string "server.env.WOODPECKER_ADMIN=$WOODPECKER_ADMIN_USER" \
    --set-string "server.env.WOODPECKER_REPO_OWNERS=${WOODPECKER_REPO_OWNERS//,/\\,}" \
    --wait
echo "UI: $WOODPECKER_SERVER (after mise run tailscale:expose)"
'''

# Needs tailscale operator rights once: `sudo tailscale set --operator=$USER`,
# plus HTTPS certificates and the funnel node attribute in the tailnet.
# Not port 443: k3s's servicelb DNATs 443 on every node address, the tailscale
# one included, to Traefik. The UI port is the one in WOODPECKER_SERVER.
["tailscale:expose"]
description = "Serve Woodpecker in the tailnet; open only its webhook path to the internet"
run = '''
#!/usr/bin/env bash
set -euo pipefail
: "${WOODPECKER_SERVER:?set it in mise.local.toml}"
port=$(echo "$WOODPECKER_SERVER" | sed -nE 's#^https://[^/:]+:([0-9]+).*#\1#p')
if [ -z "$port" ] || [ "$port" = 443 ]; then
    echo "WOODPECKER_SERVER needs a port other than 443 (k3s's Traefik owns 443), e.g. :9443" >&2
    exit 1
fi
# UI and API: tailnet only.
tailscale serve --bg --https="$port" http://127.0.0.1:30800
# GitHub webhooks: public, this one path only.
tailscale funnel --bg --https=8443 --set-path=/api/hook http://127.0.0.1:30800/api/hook
tailscale serve status
'''

["tailscale:unexpose"]
description = "Remove the Woodpecker serve and funnel configuration"
run = '''
#!/usr/bin/env bash
set -euo pipefail
port=$(echo "${WOODPECKER_SERVER:-}" | sed -nE 's#^https://[^/:]+:([0-9]+).*#\1#p')
tailscale funnel --https=8443 --set-path=/api/hook off
if [ -n "$port" ]; then tailscale serve --https="$port" off; fi
'''

# The release steps of server and webapp push image tags to this repository
# over SSH: one write deploy key, kept as a Woodpecker org secret (deploy_key)
# so both repositories share it. Rerun to rotate; the old key is removed.
["woodpecker:deploy-key"]
description = "Create (or rotate) the write deploy key of this repo and the Woodpecker org secret deploy_key"
usage = '''
flag "--org <org>" default="EchoPhase-Project" help="GitHub org owning this repo and the Woodpecker repos"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
: "${WOODPECKER_SERVER:?set it in mise.local.toml}" "${WOODPECKER_TOKEN:?set it in mise.local.toml}"
org=$usage_org title="Woodpecker CI ($org)"
dir=$(mktemp -d); trap 'rm -rf "$dir"' EXIT
ssh-keygen -q -t ed25519 -N '' -C "woodpecker@$org" -f "$dir/key"
old=$(gh api "repos/$org/deploy/keys" -q ".[] | select(.title == \"$title\") | .id")
gh api "repos/$org/deploy/keys" -f title="$title" -f key="$(cat "$dir/key.pub")" -F read_only=false -q '"deploy key \(.id) added"'
wp="woodpecker-cli --disable-update-check"
if $wp org secret show --organization "$org" --name deploy_key >/dev/null 2>&1; then
    $wp org secret update --organization "$org" --name deploy_key --value @"$dir/key" --event push --event manual
else
    $wp org secret add --organization "$org" --name deploy_key --value @"$dir/key" --event push --event manual
fi
for id in $old; do gh api -X DELETE "repos/$org/deploy/keys/$id" && echo "old deploy key $id removed"; done
'''

# Weblate (apps/weblate) listens on 127.0.0.1:30810 of the node. Its public
# host (secrets.enc.yaml: siteDomain) is this node's tailnet name on :10000,
# one of the three ports Funnel allows (443, 8443, 10000). Its /hooks/ path
# (GitHub push notifications) goes public on :8443, next to Woodpecker's.
["weblate:expose"]
description = "Serve Weblate in the tailnet on :10000 and its webhooks publicly on :8443/hooks/; --public opens all of it (Funnel)"
usage = '''
flag "--public" help="The whole UI through Funnel, for translators outside the tailnet"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ "${usage_public:-false}" = true ]; then
    tailscale funnel --bg --https=10000 http://127.0.0.1:30810
else
    tailscale serve --bg --https=10000 http://127.0.0.1:30810
fi
tailscale funnel --bg --https=8443 --set-path=/hooks/ http://127.0.0.1:30810/hooks/
tailscale serve status
'''

["weblate:unexpose"]
description = "Stop serving Weblate (UI and webhooks)"
run = [
  "tailscale serve --https=10000 off",
  "tailscale funnel --https=8443 --set-path=/hooks/ off",
]

["monitoring:expose"]
description = "Serve Grafana (:10001) and Gatus (:10002) in the tailnet (apps/monitoring)"
run = [
  "tailscale serve --bg --https=10001 http://127.0.0.1:30820",
  "tailscale serve --bg --https=10002 http://127.0.0.1:30830",
  "tailscale serve status",
]

["monitoring:unexpose"]
description = "Stop serving Grafana and Gatus"
run = [
  "tailscale serve --https=10001 off",
  "tailscale serve --https=10002 off",
]

["monitoring:password"]
description = "Print Grafana's admin password (decrypted from apps/monitoring/secrets.enc.yaml)"
run = "sops --decrypt --extract '[\"stringData\"][\"admin-password\"]' apps/monitoring/secrets.enc.yaml; echo"

# Funnel can stop answering from the internet while everything looks fine from
# inside the tailnet (GitHub webhooks then fail with EOF). This connects to the
# public Funnel address, as GitHub does; `mise run tailscale:expose` and
# `weblate:expose` re-apply the configuration, which brought it back once.
["tailscale:check"]
description = "Check that the public webhook paths answer through Funnel, as GitHub sees them"
run = '''
#!/usr/bin/env bash
set -euo pipefail
host=$(tailscale status --json | python3 -c 'import sys,json; print(json.load(sys.stdin)["Self"]["DNSName"].rstrip("."))')
ip=$(curl -fsS -H 'accept: application/dns-json' "https://cloudflare-dns.com/dns-query?name=$host&type=A" \
    | python3 -c 'import sys,json; a=json.load(sys.stdin).get("Answer",[]); print(a[0]["data"] if a else "")')
[ -n "$ip" ] || { echo "no public address for $host: is Funnel on?" >&2; exit 1; }
status=0
for path in /api/hook /hooks/github/; do
    code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 --resolve "$host:8443:$ip" -X POST "https://$host:8443$path" || true)
    case "$code" in
        000|5??) echo "FAIL $path: $code"; status=1 ;;
        *) echo "ok   $path: $code" ;;
    esac
done
[ "$status" = 0 ] || echo "Re-apply with: mise run tailscale:expose && mise run weblate:expose" >&2
exit $status
'''
