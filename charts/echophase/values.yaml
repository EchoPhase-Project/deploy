# Global settings
global:
  imagePullPolicy: IfNotPresent
  storageClass: ""

# Registry configuration
imageRegistry: localhost:30500

# EchoPhase Backend
echophase:
  image:
    repository: echophase/server
    tag: latest
    # Empty: Always for "latest", IfNotPresent for other (immutable) tags.
    pullPolicy: ""

  replicas: 1

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      # The app (~250 MiB) plus Argon2:MaxConcurrentHashes (2) password hashes in
      # flight, 64 MiB each (RFC 9106: Argon2id 64 MiB x 3, 4 lanes), and the GC's
      # slack for their buffers. Keep MaxConcurrentHashes at the CPU limit.
      memory: "1Gi"
      # A hash takes ~0.6 s on one core; two cores run two at once (MaxConcurrentHashes).
      cpu: "2"

  healthcheck:
    enabled: true
    # Liveness: the process answers.
    path: /health/live
    # Readiness: warm-up has finished, so the first request is not a cold start.
    readinessPath: /health/ready
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 5

  logs:
    enabled: true
    size: 1Gi

  # Environment variables
  env:
    ASPNETCORE_ENVIRONMENT: Production
    POSTGRES_HOST: "{{ .Release.Name }}-postgres"
    POSTGRES_PORT: "5432"
    SCYLLA_CLUSTER_NAME: echophase
    SCYLLA_CONTACT_POINT: "{{ .Release.Name }}-scylla"
    SCYLLA_SEEDS: "{{ .Release.Name }}-scylla"
    SCYLLA_AUTO_BOOTSTRAP: "1"
    SCYLLA_KEYSPACE: echophase
    VALKEY_HOST: "{{ .Release.Name }}-valkey"
    VALKEY_PORT: "6379"

# EchoPhase webapp (SolidJS + nginx)
webapp:
  image:
    repository: echophase/webapp
    tag: latest
    # Empty: Always for "latest", IfNotPresent for other (immutable) tags.
    pullPolicy: ""

  replicas: 1

  service:
    type: LoadBalancer
    port: 80
    targetPort: 80

  ingress:
    enabled: true
    # *.localhost resolves to 127.0.0.1 in browsers without /etc/hosts entries.
    host: echophase.localhost
    tls: false
    # IngressClass to use; empty uses the cluster default.
    className: ""
    # Which ingress controller serves this Ingress: "nginx" (ingress-nginx) or
    # "traefik" (k3s default). Decides how rate limits are expressed.
    controller: nginx
    # Extra annotations, merged with the generated ones.
    annotations: {}
    # Coarse per-client-IP limits for the whole site, static files included.
    # Exact per-user limits are enforced by the API; nginx in the webapp pod adds
    # per-endpoint limits in between.
    rateLimit:
      enabled: true
      # Sustained requests per second per IP.
      rps: 20
      # Allowed burst = rps * burstMultiplier (a page load fetches many assets).
      burstMultiplier: 5
      # Concurrent connections per IP (ingress-nginx only).
      connections: 50

  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# EF migrations: an init container of the server pods (runs on every start)
migrate:
  enabled: true
  image:
    repository: echophase/server
    tag: latest
    # Empty: Always for "latest", IfNotPresent for other (immutable) tags.
    pullPolicy: ""

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# PostgreSQL
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "17"

  service:
    type: ClusterIP
    port: 5432

  persistence:
    enabled: true
    size: 10Gi

  auth:
    username: echophase
    database: echophase

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  healthcheck:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 5

# Valkey (Redis)
valkey:
  enabled: true
  image:
    repository: valkey/valkey
    tag: latest

  service:
    type: ClusterIP
    port: 6379

  persistence:
    enabled: true
    size: 5Gi

  auth:

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  healthcheck:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 5

# ScyllaDB
scylla:
  enabled: true
  image:
    repository: scylladb/scylla
    tag: latest

  service:
    type: ClusterIP
    port: 9042

  persistence:
    enabled: true
    size: 20Gi

  auth:
    username: echophase

  clusterName: echophase
  keyspace: echophase
  # Let the app create the keyspace (NetworkTopologyStrategy) on first connect.
  # Only for this single-node deployment; use a migration for real clusters.
  autoCreateKeyspace: true
  autoBootstrap: 1

  resources:
    requests:
      memory: "2Gi"
      cpu: "500m"
    limits:
      memory: "4Gi"
      cpu: "2000m"

  healthcheck:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5

# Network
networkPolicy:
  enabled: false

# Credentials, rendered into the <release>-secrets Secret. Passwords have no
# defaults: put them in helm/secrets.yaml (gitignored; copy
# secrets.example.yaml), which `mise run helm:*` passes when it exists.
secrets:
  POSTGRES_USER: echophase
  POSTGRES_DB: echophase
  # POSTGRES_PASSWORD: required
  # VALKEY_PASSWORD: required
  SCYLLA_USERNAME: echophase
  # Scylla runs without authentication here, so this may stay empty.
  SCYLLA_PASSWORD: ""
