{{- if .Values.webapp.ingress.enabled }}
{{- $ingress := .Values.webapp.ingress }}
{{- $annotations := deepCopy ($ingress.annotations | default dict) }}
{{- if $ingress.rateLimit.enabled }}
{{- if eq $ingress.controller "nginx" }}
{{- $_ := set $annotations "nginx.ingress.kubernetes.io/limit-rps" ($ingress.rateLimit.rps | toString) }}
{{- $_ := set $annotations "nginx.ingress.kubernetes.io/limit-burst-multiplier" ($ingress.rateLimit.burstMultiplier | toString) }}
{{- $_ := set $annotations "nginx.ingress.kubernetes.io/limit-connections" ($ingress.rateLimit.connections | toString) }}
{{- else if eq $ingress.controller "traefik" }}
{{- $_ := set $annotations "traefik.ingress.kubernetes.io/router.middlewares" (printf "%s-%s-webapp-ratelimit@kubernetescrd" .Release.Namespace (include "echophase.fullname" .)) }}
{{- else }}
{{- fail (printf "webapp.ingress.controller must be \"nginx\" or \"traefik\", got %q" $ingress.controller) }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "echophase.fullname" . }}-webapp
  labels:
    {{- include "echophase.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
  - host: {{ $ingress.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "echophase.fullname" . }}-webapp
            port:
              number: {{ .Values.webapp.service.port }}
{{- end }}
