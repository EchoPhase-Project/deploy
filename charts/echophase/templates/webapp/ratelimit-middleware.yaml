{{- $ingress := .Values.webapp.ingress }}
{{- if and $ingress.enabled $ingress.rateLimit.enabled (eq $ingress.controller "traefik") }}
# Traefik has no rate-limit annotations; the Ingress references this
# Middleware through traefik.ingress.kubernetes.io/router.middlewares.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "echophase.fullname" . }}-webapp-ratelimit
  labels:
    {{- include "echophase.labels" . | nindent 4 }}
spec:
  rateLimit:
    average: {{ $ingress.rateLimit.rps }}
    burst: {{ mul $ingress.rateLimit.rps $ingress.rateLimit.burstMultiplier }}
    period: 1s
{{- end }}
