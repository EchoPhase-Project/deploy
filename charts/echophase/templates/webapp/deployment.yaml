apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "echophase.fullname" . }}-webapp
  labels:
    {{- include "echophase.labels" . | nindent 4 }}
    app.kubernetes.io/component: webapp
spec:
  replicas: {{ .Values.webapp.replicas }}
  selector:
    matchLabels:
      {{- include "echophase.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: webapp
  template:
    metadata:
      labels:
        {{- include "echophase.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: webapp
    spec:
      containers:
      - name: webapp
        image: "{{ .Values.imageRegistry }}/{{ .Values.webapp.image.repository }}:{{ .Values.webapp.image.tag }}"
        imagePullPolicy: {{ include "echophase.appImagePullPolicy" .Values.webapp.image }}
        env:
        # The webapp's nginx proxies /api and /gateway here.
        - name: API_UPSTREAM
          value: "{{ include "echophase.fullname" . }}:{{ .Values.echophase.service.port }}"
        # Keep serving while the pod is taken out of the Service's endpoints;
        # without the pause, requests routed to it in that window time out.
        lifecycle:
          preStop:
            sleep:
              seconds: 5
        ports:
        - containerPort: {{ .Values.webapp.service.targetPort }}
          name: http
        resources:
          {{- toYaml .Values.webapp.resources | nindent 10 }}
